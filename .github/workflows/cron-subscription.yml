name: Subscription Reminder Cron

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 08:00 WIB
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subscription reminder
        run: |
          curl -f -X GET "${{ secrets.NEXT_PUBLIC_BASE_URL }}/api/cron/subscription-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
